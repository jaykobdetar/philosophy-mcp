name: Publish to npm

# Publishes when you cut a GitHub Release.
# Requires this workflow to be configured as a Trusted Publisher for the package on npmjs.com.
on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # enables npm provenance
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Verify committed dist/ is in sync with src/
        run: test -z "$(git status --porcelain --untracked-files=all -- dist)"
      - run: npm publish --ignore-scripts --access public
